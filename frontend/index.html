        "url": "https://axonis.app/",
        "applicationCategory": "BusinessApplication",

  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:640px;margin:64px auto;padding:0 16px;font-family:ui-monospace,monospace;color:#EDEDED;background:#0E0E0E">
        <h1>Axonis — map any domain</h1>
        <p>Type a topic and Axonis reads Wikidata and OpenAlex, builds an interactive knowledge graph of its concepts, research and organisations, groups it into clusters and scores the product opportunities where research exists but products don't. Ask the map questions with cited answers, and export a research brief.</p>
        <p>Axonis needs JavaScript to draw the map.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
