<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axonis — knowledge graph explorer</title>
    <meta
      name="description"
      content="Type any domain and get a structured, interactive knowledge graph of its concepts, research, organisations and product-opportunity areas — built from open data in about thirty seconds."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- B² is dark only -->
    <meta name="theme-color" content="#0E0E0E" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Axonis — knowledge graph explorer" />
    <meta
      property="og:description"
      content="From a typed topic to a navigable map of a domain — and where the product openings are — in one tab."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Axonis — knowledge graph explorer" />
    <meta
      name="twitter:description"
      content="From a typed topic to a navigable map of a domain — and where the product openings are — in one tab."
    />
    <script>
      // B² is dark only; set it before first paint.
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <script defer src="https://stats.ontwrpn.com/script.js" data-exclude-search="true" data-exclude-hash="true" data-website-id="49493b63-b14b-43bf-8b6a-8500fbd64b33" data-domains="axonis.app,knowledge-graph-explorer.ontwrpn.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
